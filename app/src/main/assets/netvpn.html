<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdAway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --surface: #141416;
  --surface-2: #1c1c1f;
  --border: #27272a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --indigo: #ef4444;
  --indigo-dim: #b91c1c;
  --cyan: #ec4899;
  --red: #f87171;
  --green: #34d399;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(600px 300px at 50% -80px, rgba(239,68,68,0.16), transparent),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 24px 16px 60px;
}
.wrap { max-width: 460px; margin: 0 auto; }
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}
.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--indigo), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15px;
  position: relative;
}
.brand-mark::after {
  content: '';
  position: absolute;
  top: -2px;
  right: -2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
  border: 2px solid var(--bg);
}
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; }
.brand-sub { font-size: 12px; color: var(--text-muted); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}

.vpn-card { position: relative; overflow: hidden; transition: border-color .3s; }
.vpn-card.connected { border-color: rgba(239,68,68,0.4); }
.vpn-top { display: flex; justify-content: space-between; align-items: flex-start; }
.vpn-status-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.vpn-status-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  font-weight: 600;
  transition: color .25s;
}
.vpn-status-text.on { color: var(--green); }
.vpn-status-text.connecting { color: var(--cyan); }
.vpn-status-text.off { color: var(--text-muted); }

.switch {
  width: 50px;
  height: 30px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s, border-color .25s;
}
.switch.active { background: linear-gradient(135deg, var(--indigo), var(--cyan)); border-color: transparent; }
.switch-knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--text);
  transition: transform .25s;
}
.switch.active .switch-knob { transform: translateX(20px); }
.switch.disabled { opacity: .5; cursor: default; }

.vpn-stats { display: flex; gap: 20px; margin-top: 18px; }
.vpn-stat-num { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 500; }
.vpn-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
}

.add-row { display: flex; gap: 8px; margin-bottom: 14px; }
.add-input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
}
.add-input::placeholder { color: var(--text-muted); font-family: 'Inter', sans-serif; }
.add-input:focus { border-color: var(--indigo); }
.add-btn {
  background: linear-gradient(135deg, var(--indigo), var(--indigo-dim));
  border: none;
  border-radius: 10px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 13px;
  padding: 0 16px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(239,68,68,0.3);
}
.add-btn:active { transform: scale(.97); }

.filter-row { display: flex; gap: 6px; margin-bottom: 14px; }
.filter-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 12px;
  padding: 6px 12px;
  cursor: pointer;
}
.filter-btn.active { background: var(--surface-2); border-color: var(--indigo); color: var(--text); }

.domain-list { display: flex; flex-direction: column; gap: 8px; }
.domain-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
}
.domain-name {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.domain-name.disabled { color: var(--text-muted); text-decoration: line-through; }
.domain-edit-input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--indigo);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  padding: 2px 0;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
  font-size: 14px;
}
.icon-btn:hover { color: var(--text); }
.icon-btn.danger:hover { color: var(--red); }

.empty-state { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 13px; }

.mini-switch {
  width: 34px;
  height: 20px;
  border-radius: 999px;
  background: var(--border);
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s;
}
.mini-switch.active { background: var(--indigo); }
.mini-switch-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  transition: transform .2s;
}
.mini-switch.active .mini-switch-knob { transform: translateX(14px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div>
      <div class="brand-name">AdAway</div>
      <div class="brand-sub">Chặn quảng cáo qua DNS</div>
    </div>
  </div>

  <div class="card vpn-card">
    <div class="vpn-top">
      <div>
        <div class="vpn-status-label">Trạng thái VPN</div>
        <div class="vpn-status-text off" id="vpnStatusText">Đang tắt</div>
      </div>
      <div class="switch" id="vpnSwitch" onclick="toggleVpn()">
        <div class="switch-knob"></div>
      </div>
    </div>
    <div class="vpn-stats">
      <div>
        <div class="vpn-stat-num" id="blockedCount">0</div>
        <div class="vpn-stat-label">đã chặn</div>
      </div>
      <div>
        <div class="vpn-stat-num" id="activeDomainCount">0</div>
        <div class="vpn-stat-label">domain đang bật</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Quản lý domain</div>
    <div class="add-row">
      <input class="add-input" id="addInput" placeholder="vd: ads.example.com" onkeydown="if(event.key==='Enter')addDomain()">
      <button class="add-btn" onclick="addDomain()">Thêm</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tất cả</button>
      <button class="filter-btn" data-filter="on" onclick="setFilter('on')">Đang bật</button>
      <button class="filter-btn" data-filter="off" onclick="setFilter('off')">Đang tắt</button>
    </div>
    <div class="domain-list" id="domainList"></div>
  </div>
</div>

<script>
let filter = 'all';
let editingName = null;
let statsTimer = null;

function esc(s) { return s.replace(/'/g, "\\'"); }

function refreshDomains() {
  const domains = JSON.parse(Android.getDomains());
  renderDomains(domains);
}

function toggleVpn() {
  const sw = document.getElementById('vpnSwitch');
  if (sw.classList.contains('disabled')) return;
  Android.requestToggleVpn();
}

function onVpnStatus(status, label) {
  const sw = document.getElementById('vpnSwitch');
  const text = document.getElementById('vpnStatusText');
  const card = document.querySelector('.vpn-card');
  text.textContent = label;
  sw.classList.remove('disabled');
  if (status === 'RUNNING') {
    sw.classList.add('active');
    text.className = 'vpn-status-text on';
    card.classList.add('connected');
    startStatsPolling();
  } else if (status === 'STOPPED') {
    sw.classList.remove('active');
    text.className = 'vpn-status-text off';
    card.classList.remove('connected');
    stopStatsPolling();
    document.getElementById('blockedCount').textContent = '0';
  } else if (status === 'STARTING' || status === 'RECONNECTING' || status === 'RECONNECTING_NETWORK_ERROR') {
    sw.classList.add('disabled');
    text.className = 'vpn-status-text connecting';
  } else {
    text.className = 'vpn-status-text off';
  }
}

function startStatsPolling() {
  updateStats();
  statsTimer = setInterval(updateStats, 1000);
}
function stopStatsPolling() {
  clearInterval(statsTimer);
}
function updateStats() {
  document.getElementById('blockedCount').textContent = Android.getBlockedCount();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  refreshDomains();
}

function addDomain() {
  const input = document.getElementById('addInput');
  const val = input.value.trim();
  if (!val) return;
  const domains = JSON.parse(Android.addDomain(val));
  input.value = '';
  renderDomains(domains);
}

function deleteDomain(name) {
  const domains = JSON.parse(Android.deleteDomain(name));
  renderDomains(domains);
}

function toggleDomain(name) {
  const domains = JSON.parse(Android.toggleDomain(name));
  renderDomains(domains);
}

function startEdit(name) {
  editingName = name;
  refreshDomains();
}

function saveEdit(oldName, value) {
  const val = value.trim();
  editingName = null;
  if (val && val !== oldName) {
    const domains = JSON.parse(Android.renameDomain(oldName, val));
    renderDomains(domains);
  } else {
    refreshDomains();
  }
}

function renderDomains(domains) {
  const list = document.getElementById('domainList');
  let filtered = domains;
  if (filter === 'on') filtered = domains.filter(d => d.enabled);
  if (filter === 'off') filtered = domains.filter(d => !d.enabled);

  document.getElementById('activeDomainCount').textContent = domains.filter(d => d.enabled).length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">Chưa có domain nào ở mục này</div>';
    return;
  }

  list.innerHTML = filtered.map(d => {
    const safe = esc(d.name);
    if (editingName === d.name) {
      return `<div class="domain-row">
        <input class="domain-edit-input" value="${d.name}" autofocus
          onkeydown="if(event.key==='Enter')saveEdit('${safe}', this.value)"
          onblur="saveEdit('${safe}', this.value)">
      </div>`;
    }
    return `<div class="domain-row">
      <div class="domain-name ${d.enabled ? '' : 'disabled'}">${d.name}</div>
      <div class="mini-switch ${d.enabled ? 'active' : ''}" onclick="toggleDomain('${safe}')">
        <div class="mini-switch-knob"></div>
      </div>
      <button class="icon-btn" onclick="startEdit('${safe}')">✎</button>
      <button class="icon-btn danger" onclick="deleteDomain('${safe}')">✕</button>
    </div>`;
  }).join('');
}

refreshDomains();
if (Android.isVpnRunning()) {
  onVpnStatus('RUNNING', 'Đã bật');
}
</script>
</body>
</html>
